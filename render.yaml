services:
  - type: web
    name: safe-financas-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT
    disk:
      name: safe-financas-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/safe_financas.db
      - key: FRONTEND_ORIGINS
        value: https://.*\.vercel\.app,http://localhost:5173